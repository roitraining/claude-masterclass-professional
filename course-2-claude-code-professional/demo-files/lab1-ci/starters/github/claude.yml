name: Claude Code
# Starter for Lab 1. This file works, and it is not safe. Find and fix what the security gate reports.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions: write-all

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Debug credentials
        run: |
          echo "Starting Claude with key ${{ secrets.ANTHROPIC_API_KEY }}"
          printenv | sort

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          claude_args: |
            --allowedTools "Bash"
