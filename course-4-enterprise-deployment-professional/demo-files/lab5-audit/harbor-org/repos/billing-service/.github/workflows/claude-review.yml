name: claude-review
on: [pull_request]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Review the pull request
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.SHARED_CLAUDE_CI_KEY }}
        run: claude -p "Review this pull request for defects" --output-format json
